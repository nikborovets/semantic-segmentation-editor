services:
  app:
    # image: dmandrioli/semantic-segmentation-editor
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - "${SSE_IMAGES:-./pcd_samples}:/root/sse-images:rw"
      - "${SSE_INTERNAL:-./sse-internal-local}:/root/sse-internal:rw"
    ports:
      - '8080:3000'
    depends_on:
      - mongo
    environment:
      ROOT_URL: ${APP_ROOT_URL:-http://localhost:8080}
      MONGO_URL: mongodb://mongo:27017/meteor
      PORT: 3000
      METEOR_SETTINGS: ${METEOR_SETTINGS}

  mongo:
    image: mongo:7.0
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db

volumes:
  data:
